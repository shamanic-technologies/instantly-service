name: Seed placement cron

# The IN-HOUSE inbox-placement test — the self-hosted replacement for Instantly's
# $47/mo Growth Inbox Placement subscription. It spends nothing: every sender and
# every receiver is a mailbox we already own, and the only cost is the seed mail
# itself.
#
# BOTH steps run DAILY, and the run step decides for itself whether a test is due.
#
#   1. POST /internal/audit/seed-placement/run   — daily, DECLINES most days.
#      The endpoint asks `decideSeedTestDue`: not due inside 6 days, due on a
#      send-free day once the interval has passed, and due on ANY day once the
#      evidence is 12 days old. Gated behind SEED_PLACEMENT_ENABLED=true; a 409
#      (not armed) is tolerated.
#
#   2. POST /internal/audit/seed-placement/sync  — daily.
#      Reads the receiver mailboxes, records which folder each seed landed in,
#      and promotes the result into `instantly_placement_results` (the same
#      silver the Instantly path writes).
#
# ⚠️ WHY DAILY RATHER THAN A WEEKLY CRON. GitHub Actions silently delays and
# skips scheduled workflows under load — on 2026-08-29 the 06:00 Saturday
# placement job never fired at all and the 05:30 prime job ran at 11:45. A
# weekly cron therefore means "most weeks", and here the cost of a miss is not a
# late report: DELIVERY_EVIDENCE_MAX_AGE_DAYS is 16, so two consecutive misses
# age every account into `delivery_evidence_stale` and the fleet stops sending.
# Calling daily and letting the DATA decide makes a skipped tick free.
#
# ⚠️ Do NOT chain `sync` onto `run` in one job. Both endpoints answer 202 and work
# in the background, so a chained read would race the writes it depends on — and
# even setting that aside, seeds need time to be delivered and filed. That exact
# create-then-read-in-one-run shape is what made `placement-cron.yml` ingest
# week-old results for months. A daily sync bounds result latency at ~24h while
# the seeds themselves land within minutes.
#
# The send still LANDS on a weekend in the normal case: `decideSeedTestDue`
# declines on a sending day, so the first tick that passes the 6-day interval is
# a Saturday (or the Sunday after, if Saturday's tick is skipped). The campaign
# send window is Mon-Fri and warmup is weekday-only, so the seed spike lands on
# an otherwise-idle mailbox. Only the 12-day urgent trigger overrides that, and
# a weekday spike is the lesser evil against the whole fleet ageing out.
#
# Scheduled runs fire from the DEFAULT branch (main).
#
# Required secrets (already used by reconcile-cron.yml / placement-cron.yml):
#   INSTANTLY_SERVICE_URL       — production service URL
#   INSTANTLY_SERVICE_API_KEY   — service API key for /internal/* routes
#
# Manually trigger via the workflow_dispatch button on the GitHub Actions page.

on:
  schedule:
    - cron: "0 8 * * *" # DAILY 08:00 UTC — ask whether a seed test is due (declines most days)
    - cron: "0 9 * * *" # DAILY 09:00 UTC — read the seeds back (see the cadence note above)
  workflow_dispatch:

jobs:
  seed-placement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: POST /internal/audit/seed-placement/run
        # Weekly step. The condition is TRUE for the Saturday cron AND for a
        # manual workflow_dispatch (whose `schedule` is empty), so a manual run
        # still does the full send-then-read sequence.
        if: github.event.schedule != '0 9 * * *'
        env:
          SERVICE_URL: ${{ secrets.INSTANTLY_SERVICE_URL }}
          API_KEY: ${{ secrets.INSTANTLY_SERVICE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SERVICE_URL}" ] || [ -z "${API_KEY}" ]; then
            echo "Missing INSTANTLY_SERVICE_URL or INSTANTLY_SERVICE_API_KEY secret"
            exit 1
          fi

          response_file=$(mktemp)
          http_status=$(curl -sS -o "${response_file}" -w "%{http_code}" \
            -X POST \
            -H "X-API-Key: ${API_KEY}" \
            -H "Content-Type: application/json" \
            --max-time 120 \
            "${SERVICE_URL}/internal/audit/seed-placement/run")

          echo "HTTP ${http_status}"
          cat "${response_file}"
          echo

          # 202 = accepted; the endpoint decides in the background whether a test
          # is due and logs `not due (...)` when it declines.
          # 409 = SEED_PLACEMENT_ENABLED not armed — tolerated, the sync step
          # still runs (and finds nothing pending). Anything else is a real failure.
          if [ "${http_status}" != "202" ] && [ "${http_status}" != "409" ]; then
            echo "seed-placement/run failed with HTTP ${http_status}"
            exit 1
          fi

      - name: POST /internal/audit/seed-placement/sync
        env:
          SERVICE_URL: ${{ secrets.INSTANTLY_SERVICE_URL }}
          API_KEY: ${{ secrets.INSTANTLY_SERVICE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SERVICE_URL}" ] || [ -z "${API_KEY}" ]; then
            echo "Missing INSTANTLY_SERVICE_URL or INSTANTLY_SERVICE_API_KEY secret"
            exit 1
          fi

          response_file=$(mktemp)
          http_status=$(curl -sS -o "${response_file}" -w "%{http_code}" \
            -X POST \
            -H "X-API-Key: ${API_KEY}" \
            -H "Content-Type: application/json" \
            --max-time 60 \
            "${SERVICE_URL}/internal/audit/seed-placement/sync")

          echo "HTTP ${http_status}"
          cat "${response_file}"
          echo

          # 202 + background. Completion is confirmed in the service logs
          # (`seed-placement-sync: done`), NOT by this curl's exit code.
          if [ "${http_status}" != "202" ] && [ "${http_status}" != "200" ]; then
            echo "seed-placement/sync dispatch failed with HTTP ${http_status}"
            exit 1
          fi
