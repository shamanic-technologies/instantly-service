name: Provider infrastructure inventory (daily)

# Polls the FOUR vendors that sell us sending infrastructure — Gandi (three
# organisations), Mailforge, Primeforge and Instantly DFY — into bronze, upserts
# the canonical silver inventory, and flags rows a vendor stopped reporting.
#
# Why this exists (issue #555): until now only Instantly was known to the code,
# and only at the ACCOUNT grain. There was no domain entity at all, so nothing
# could answer who we bought a domain from, when it expires, or what it costs —
# while 8 domains sat paid with zero sending accounts.
#
# Safe to run daily: every call is a read against a flat subscription, so it
# spends no vendor quota and declares no metered cost. Domain and mailbox
# inventories change on the order of days, so a daily cadence is enough; there is
# nothing here that benefits from running more often.
#
# A single vendor failing is counted and logged without stopping the others —
# the endpoint only errors when EVERY vendor failed. Until the five new platform
# keys are registered in key-service (gandi-org1..3, mailforge, primeforge) this
# job will report those vendors as failed, which is the intended loud signal.
#
# Required secrets (already used by the other crons in this repo):
#   INSTANTLY_SERVICE_URL      — production service URL
#   INSTANTLY_SERVICE_API_KEY  — service API key for /internal/* routes
#
# Scheduled runs fire from the DEFAULT branch (main). Manually trigger via the
# workflow_dispatch button on the GitHub Actions page.

on:
  schedule:
    - cron: "0 5 * * *" # DAILY 05:00 UTC — before the 06:00 Saturday placement test
  workflow_dispatch:

jobs:
  infra-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: POST /internal/infra/sync
        env:
          SERVICE_URL: ${{ secrets.INSTANTLY_SERVICE_URL }}
          API_KEY: ${{ secrets.INSTANTLY_SERVICE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SERVICE_URL}" ] || [ -z "${API_KEY}" ]; then
            echo "Missing INSTANTLY_SERVICE_URL or INSTANTLY_SERVICE_API_KEY secret"
            exit 1
          fi

          response_file=$(mktemp)
          status=$(curl -sS -o "${response_file}" -w "%{http_code}" \
            -X POST \
            -H "X-API-Key: ${API_KEY}" \
            -H "Content-Type: application/json" \
            --max-time 60 \
            "${SERVICE_URL}/internal/infra/sync")

          echo "HTTP ${status}"
          cat "${response_file}"
          echo

          # The endpoint returns 202 and sweeps in the background. Per-vendor
          # results land in the Railway logs under `infra-sync: done` — that log
          # line, not this curl exit code, is what says whether a vendor failed.
          if [ "${status}" != "202" ] && [ "${status}" != "200" ]; then
            echo "infra-sync dispatch failed with HTTP ${status}"
            exit 1
          fi
