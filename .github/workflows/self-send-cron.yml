name: Self-send dispatch (hourly)

# Sends the steps that have come due on the self-hosted SMTP transport.
#
# Hourly rather than daily because a step's due moment is a timestamp, not a
# date: a lead contacted at 09:00 with a 2-day gap comes due at 09:00 two days
# later, and a daily sweep would hold it until whenever that sweep runs. Hourly
# keeps the delay between "due" and "sent" under an hour, which is well inside
# the noise of the nominal cadence itself.
#
# Safe to run this often. The sweep is idempotent — a step leaves the due set the
# moment its cost hold stops being `provisioned`, which happens as part of
# promoting the `email_sent` event — and per-mailbox daily caps
# (`min(daily_limit, rampCapForAge)` minus what already went out today) bound the
# volume regardless of how many times it fires. An hour with nothing due is a
# no-op that sends nothing.
#
# TWO independent switches gate this, deliberately:
#   - SELF_SEND_DISPATCH_ENABLED on the service — stops the whole sweep in one
#     env change without touching any account row. A 409 here is TOLERATED, so
#     this cron is harmless while the feature is disarmed.
#   - instantly_accounts.send_transport per mailbox — decides which mailboxes are
#     eligible at all. With none set to 'smtp', a run reads an empty queue.
#
# Required secrets (same as the other crons):
#   INSTANTLY_SERVICE_URL      — production URL
#   INSTANTLY_SERVICE_API_KEY  — service API key for /internal/* routes
#
# Scheduled runs fire from the DEFAULT branch (main) only. Manually trigger via
# the workflow_dispatch button on the GitHub Actions page.

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: POST /internal/self-send/dispatch
        env:
          SERVICE_URL: ${{ secrets.INSTANTLY_SERVICE_URL }}
          API_KEY: ${{ secrets.INSTANTLY_SERVICE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SERVICE_URL}" ] || [ -z "${API_KEY}" ]; then
            echo "Missing INSTANTLY_SERVICE_URL or INSTANTLY_SERVICE_API_KEY secret"
            exit 1
          fi

          # Fire-and-forget (202). Verify via the service logs
          # (`self-send-dispatch: done {...}`).
          response_file=$(mktemp)
          status=$(curl -sS -o "${response_file}" -w "%{http_code}" \
            -X POST \
            -H "X-API-Key: ${API_KEY}" \
            -H "Content-Type: application/json" \
            --max-time 60 \
            "${SERVICE_URL}/internal/self-send/dispatch")

          echo "HTTP ${status}"
          cat "${response_file}"
          echo

          # 409 = disarmed (SELF_SEND_DISPATCH_ENABLED not 'true'). Expected while
          # the transport is dormant, so it must not fail the run.
          if [ "${status}" = "409" ]; then
            echo "self-send dispatch is disarmed — nothing to do"
            exit 0
          fi

          if [ "${status}" != "202" ] && [ "${status}" != "200" ]; then
            echo "self-send dispatch failed with HTTP ${status}"
            exit 1
          fi
