name: Inbox-placement tests (maintain + sync)

# Keeps the fleet inbox-placement deliverability history fresh. Two steps:
#
# NOTE: this workflow no longer calls /internal/audit/accounts-sync. That
# endpoint used to be the first step here AND in accounts-sync-cron.yml AND in
# lifecycle-cron.yml — the same job fired ~37 times a day from three schedules.
# lifecycle-cron runs it HOURLY, which strictly supersedes both other callers, so
# silver is at most an hour old when the weekly test seeds its pool. The other
# two callers were removed (issue #555).
#
#   1. POST /internal/audit/placement-test/run — create ONE one-time (type-1)
#      fleet placement test that runs immediately. This is the plan-compatible
#      path: automated (type-2) tests are HyperGrowth-gated (402 on Growth), so
#      the recurrence comes from THIS cron, not Instantly's server-side schedule.
#      SPENDS Growth-sub quota per run, and is GATED behind
#      PLACEMENT_TESTS_ENABLED=true on the service — returns 409 (tolerated here)
#      until armed, so this workflow is safe to land before arming.
#   2. POST /internal/audit/placement-test/sync — poll the tests + analytics
#      into our Bronze/Silver/Gold tables so account-health reflects the latest
#      results. Read-only against Instantly (spends no quota).
#
# ⚠️ SYNC CADENCE (load-bearing) — `sync` runs DAILY, DECOUPLED from `run`.
# An Instantly placement test takes HOURS to finish. When `sync` was chained
# directly after `run` in the same weekly job, it polled the test it had created
# ~4 minutes earlier (still `status:1`, zero analytics) and therefore NEVER
# ingested it — the results only reached silver at the NEXT week's sync. Effect:
# every account's `delivery` was up to 7 days stale, and a mailbox created
# mid-week waited ~2 weeks (test on Saturday, results the following Saturday)
# before it could ever leave `in_recovery`. Proven in prod 2026-07-25: test
# 019f9856 (230 senders) sat in bronze at `status:1` with 0 silver rows while
# the 07-19 test only landed at that same 07-25 sync.
# So: the weekly Saturday schedule keeps `run`; a DAILY 07:00
# schedule runs `sync` ALONE (read-only against Instantly, spends no quota), which
# bounds result latency to <= 24h. Do NOT re-chain sync immediately after run.
#
# The weekly-only steps are gated with `if: github.event.schedule != '0 7 * * *'`
# — that form is TRUE for the weekly cron AND for workflow_dispatch, so a manual
# run still does the full run + sync sequence.
#
# The `run` step fires once a week, on SATURDAY → one one-time test covering the
# WHOLE testable pool. Saturday AND Sunday are both send-free days
# (campaign send window is Mon-Fri, warmup is weekday-only), so the ~30-50
# seeds/account spike lands on an otherwise-empty mailbox day — and if it
# overflows the per-account daily send cap on Saturday, the overflow finishes on
# Sunday, still an empty day — no rotation needed.
# Scheduled runs fire from the DEFAULT branch (main).
#
# Required secrets (already used by reconcile-cron.yml):
#   INSTANTLY_SERVICE_URL       — production service URL
#   INSTANTLY_SERVICE_API_KEY   — service API key for /internal/* routes
#
# Manually trigger via the workflow_dispatch button on the GitHub Actions page.

on:
  schedule:
    - cron: "0 6 * * 6" # Saturdays 06:00 UTC — one weekly full-pool test
    - cron: "0 7 * * *" # DAILY 07:00 UTC — sync ONLY (see the sync-cadence note above)
  workflow_dispatch:

jobs:
  placement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: POST /internal/audit/placement-test/run
        if: github.event.schedule != '0 7 * * *'
        env:
          SERVICE_URL: ${{ secrets.INSTANTLY_SERVICE_URL }}
          API_KEY: ${{ secrets.INSTANTLY_SERVICE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SERVICE_URL}" ] || [ -z "${API_KEY}" ]; then
            echo "Missing INSTANTLY_SERVICE_URL or INSTANTLY_SERVICE_API_KEY secret"
            exit 1
          fi

          response_file=$(mktemp)
          status=$(curl -sS -o "${response_file}" -w "%{http_code}" \
            -X POST \
            -H "X-API-Key: ${API_KEY}" \
            -H "Content-Type: application/json" \
            --max-time 120 \
            "${SERVICE_URL}/internal/audit/placement-test/run")

          echo "HTTP ${status}"
          cat "${response_file}"
          echo

          # 200 = one-time test created. 409 = PLACEMENT_TESTS_ENABLED not armed
          # yet — tolerated (sync still runs, no test created). Anything else
          # (402 quota, 400, 5xx) is a real failure.
          if [ "${status}" != "200" ] && [ "${status}" != "409" ]; then
            echo "placement-test/run failed with HTTP ${status}"
            exit 1
          fi

      - name: POST /internal/audit/placement-test/sync
        env:
          SERVICE_URL: ${{ secrets.INSTANTLY_SERVICE_URL }}
          API_KEY: ${{ secrets.INSTANTLY_SERVICE_API_KEY }}
        run: |
          set -euo pipefail

          response_file=$(mktemp)
          status=$(curl -sS -o "${response_file}" -w "%{http_code}" \
            -X POST \
            -H "X-API-Key: ${API_KEY}" \
            -H "Content-Type: application/json" \
            --max-time 60 \
            "${SERVICE_URL}/internal/audit/placement-test/sync")

          echo "HTTP ${status}"
          cat "${response_file}"
          echo

          # Endpoint returns 202 Accepted and runs the sweep in the background.
          # Verify completion via Railway logs (`placement-sync: done`), NOT this
          # curl exit code.
          if [ "${status}" != "202" ] && [ "${status}" != "200" ]; then
            echo "placement-test/sync dispatch failed with HTTP ${status}"
            exit 1
          fi
